# La suite gira da sola a ogni push, invece che quando fa comodo (#44).
#
# Due lavori, due scopi diversi, e non e' duplicazione:
#
# - `suite` gira su **tre piattaforme** perche' PRODUCT.md dichiara che un
#   esito discreto dipendente dalla piattaforma e' un difetto, e questa
#   matrice ne e' il **rilevatore**: uno di quei difetti e' gia' stato trovato
#   (l'ordine dei voxel di Open3D fra Windows x86-64 e macOS arm64). Lo
#   sviluppo avviene su macOS arm64, quindi sono i leg Linux e Windows a dire
#   qualcosa di nuovo. Windows c'e' dal 13/09/2026: e' la piattaforma d'uso
#   dell'autore (`MeshRec.bat`, la finestra WebView2) ed era l'unica mai
#   coperta in CI. Le
#   grandezze **continue** non sono bit-identiche fra
#   architetture e i test infatti confrontano con tolleranze relative: se
#   questa matrice diventasse rossa per l'ultima cifra, la risposta e' la
#   tolleranza dichiarata, non l'uguaglianza esatta.
#
# - `benchmark` gira **solo su Linux** e installa CalculiX, perche' il patch
#   test -- l'unico benchmark di verifica rimasto dal 03/09/2026, quando NAFEMS,
#   la mensola e l'equilibrio delle reazioni sono usciti con la mappa #161 --
#   senza solutore non esiste.
#
# Perche' due lavori invece di uno: senza solutore la suite **non fallisce**,
# salta -- misurato il 26/08/2026, 1166 passed e 40 skipped, zero rossi
# (prima della mappa #161; oggi la suite predefinita conta ~1313). E'
# il comportamento giusto per chi clona senza CalculiX, ma in CI diventa una
# trappola: i benchmark potrebbero saltare per sempre e il verde direbbe
# «tutto a posto». Nel lavoro `benchmark` il solutore e' quindi **dichiarato
# obbligatorio** e `ccx -v` fa fallire il lavoro se manca, invece di lasciare
# che 34 test scompaiano in silenzio.

name: suite

on:
  push:
    branches: [main]
  pull_request:
  # Lancio a mano: serve per rilanciare la suite senza un commit finto quando
  # a cambiare e' l'ambiente e non il codice -- una versione nuova di `ccx`
  # nei repository Ubuntu, o una wheel ricostruita a monte.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sola lettura: questi lavori eseguono test e non scrivono nulla nel
# repository. Il predefinito darebbe il permesso di scrittura sui contenuti a
# ogni passo, compreso il codice di terzi in `uses:`.
permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false # i tre leg si leggono insieme
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # I test della logica dell'interfaccia eseguono davvero il JavaScript e
      # senza `node` si saltano: 158 test su questa sola voce, misurati il
      # 03/09/2026 con un PATH che non lo porta. Averlo qui e'
      # meta' del valore di questa CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # open3d e gmsh portano wheel Linux ma vogliono le librerie grafiche di
      # sistema anche a schermo spento: senza queste l'import fallisce.
      - name: librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgomp1 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: sincronizza le dipendenze
        working-directory: meshrec
        run: uv sync --frozen

      - name: diagnosi git (temporanea)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: meshrec
        run: |
          $sonda = @'
          import ctypes, os
          def reale(dove):
              b = ctypes.create_unicode_buffer(32767)
              n = ctypes.windll.kernel32.GetEnvironmentVariableW("PATH", b, 32767)
              print(dove, "reale", n, "os.environ", len(os.environ["PATH"]), flush=True)
          reale("inizio")
          import pymeshlab
          reale("import pymeshlab")
          ms = pymeshlab.MeshSet()
          reale("MeshSet")
          import gmsh
          reale("import gmsh")
          gmsh.initialize()
          reale("gmsh.initialize")
          gmsh.finalize()
          reale("gmsh.finalize")
          '@
          Set-Content -Path "$env:RUNNER_TEMP\sonda.py" -Value $sonda
          uv run python "$env:RUNNER_TEMP\sonda.py"

      - name: la suite predefinita
        working-directory: meshrec
        run: uv run pytest -q

  benchmark:
    name: benchmark di verifica (CalculiX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgomp1 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: CalculiX
        run: |
          sudo apt-get install -y calculix-ccx
          # Il pacchetto puo' installare il binario come `ccx` oppure come
          # `ccx_2.x`; i test lo cercano sul PATH col nome `ccx`, quindi si
          # normalizza qui invece di indovinare il nome a monte.
          if ! command -v ccx >/dev/null; then
            trovato=$(ls /usr/bin/ccx* 2>/dev/null | head -1)
            if [ -n "$trovato" ]; then sudo ln -s "$trovato" /usr/bin/ccx; fi
          fi
          # Dichiarato obbligatorio: se manca, il lavoro fallisce qui e si
          # vede, invece di far sparire test in un verde. Sono i test che
          # *spariscono*, non quelli marcati: rimisurati il 03/09/2026
          # lanciando la suite con `ccx` fuori dal PATH -- 3 saltati (erano 54
          # il 28/08/2026, prima della mappa #161) contro l'unico di base, che
          # e' `wildmeshing` assente.
          #
          # Il segnale NON e' il codice d'uscita: `ccx -v` stampa la versione e
          # poi esce con **201** (misurato sul runner al primo giro: il lavoro
          # e' fallito esattamente per questo). Si controlla quindi che il
          # binario esista e che stampi una versione.
          if ! command -v ccx >/dev/null; then
            echo "CalculiX assente: i benchmark di verifica non sono eseguibili"
            exit 1
          fi
          versione=$(ccx -v 2>&1 | tr -d '\r' | grep -i version || true)
          if [ -z "$versione" ]; then
            echo "ccx presente ma non stampa una versione: binario sospetto"
            exit 1
          fi
          # Il runner Ubuntu porta la 2.21, lo sviluppo locale la 2.22: la
          # differenza e' dichiarata qui perche' i numeri dei benchmark
          # potrebbero dipenderne, e un giorno potrebbe spiegare uno scarto.
          echo "CalculiX sul runner -> $versione"

      - name: sincronizza le dipendenze
        working-directory: meshrec
        run: uv sync --frozen

      # Tutti i marcatori: la suite predefinita piu' `validazione` (5 test, il
      # solo patch test) e `feasibility` (5). E' il numero che si cita in tesi,
      # quindi si rimisura invece di ricopiarlo: `pytest tests -q -m
      # <marcatore> --collect-only`, il 03/09/2026 dopo la mappa #161.
      - name: la suite completa, marcatori compresi
        working-directory: meshrec
        run: uv run pytest -m "" -q
